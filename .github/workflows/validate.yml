name: Validate package

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  pr-target-policy:
    name: PR target policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate protected branch workflow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event: branch protection policy is enforced by GitHub."
            exit 0
          fi

          if [ "$BASE_REF" = "development" ]; then
            echo "Contributor PR target is development."
            exit 0
          fi

          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              development|release/*)
                ;;
              *)
                echo "Pull requests to main are release-only. Open contributor PRs against development."
                exit 1
                ;;
            esac

            if [ "$ACTOR" != "Daliys" ]; then
              echo "Only Daliys may open release PRs to main."
              exit 1
            fi

            echo "Release PR target is main."
            exit 0
          fi

          echo "Unsupported pull request target: $BASE_REF"
          exit 1

  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run static package validation
        run: bash scripts/prepush-validate.sh --static-only

  unity-editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    needs: static-validation
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_VERSION: 6000.0.23f1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip Unity tests when license is unavailable
        if: ${{ env.UNITY_LICENSE == '' }}
        run: echo "::notice::UNITY_LICENSE is not configured; skipping Unity EditMode tests."

      - name: Create temporary Unity project
        if: ${{ env.UNITY_LICENSE != '' }}
        run: |
          mkdir -p .ci/unity-project/Packages .ci/unity-project/ProjectSettings
          cat > .ci/unity-project/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.forkhorizon.nexus.unity": "file:../..",
              "com.unity.test-framework": "1.4.6"
            },
            "testables": [
              "com.forkhorizon.nexus.unity"
            ]
          }
          JSON
          cat > .ci/unity-project/ProjectSettings/ProjectVersion.txt <<EOF
          m_EditorVersion: ${UNITY_VERSION}
          m_EditorVersionWithRevision: ${UNITY_VERSION}
          EOF

      - name: Run Unity EditMode tests
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .ci/unity-project
          testMode: EditMode
          unityVersion: ${{ env.UNITY_VERSION }}
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test results
        if: ${{ always() && env.UNITY_LICENSE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: unity-test-results
