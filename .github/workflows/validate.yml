name: Validate package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run static package validation
        run: bash scripts/prepush-validate.sh --static-only

  unity-editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    needs: static-validation
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_VERSION: 6000.0.23f1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip Unity tests when license is unavailable
        if: ${{ env.UNITY_LICENSE == '' }}
        run: echo "::notice::UNITY_LICENSE is not configured; skipping Unity EditMode tests."

      - name: Create temporary Unity project
        if: ${{ env.UNITY_LICENSE != '' }}
        run: |
          mkdir -p .ci/unity-project/Packages .ci/unity-project/ProjectSettings
          cat > .ci/unity-project/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.forkhorizon.nexus.unity": "file:../..",
              "com.unity.test-framework": "1.4.6"
            },
            "testables": [
              "com.forkhorizon.nexus.unity"
            ]
          }
          JSON
          cat > .ci/unity-project/ProjectSettings/ProjectVersion.txt <<EOF
          m_EditorVersion: ${UNITY_VERSION}
          m_EditorVersionWithRevision: ${UNITY_VERSION}
          EOF

      - name: Run Unity EditMode tests
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .ci/unity-project
          testMode: EditMode
          unityVersion: ${{ env.UNITY_VERSION }}
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test results
        if: ${{ always() && env.UNITY_LICENSE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: unity-test-results
