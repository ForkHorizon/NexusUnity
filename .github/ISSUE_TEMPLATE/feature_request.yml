name: Feature request
description: Suggest an improvement for Nexus Unity
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please keep requests focused on local Unity Editor automation and trusted developer workflows.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Nexus Unity do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Unity Editor window
        - Raw JSON-RPC API
        - Python MCP bridge
        - Documentation
        - Tests/validation
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
